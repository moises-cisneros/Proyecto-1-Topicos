name: CI Pipeline (SMS Sentinel)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  python-lint-and-test:
    name: Backend & ML Pipeline CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi
          pip install pytest pytest-cov httpx flake8

      - name: Descargar recursos lingüísticos (NLTK y SpaCy)
        run: |
          python -m spacy download es_core_news_sm || true
          python -c "import nltk; nltk.download('stopwords'); nltk.download('punkt')" || true

      - name: Verificación de sintaxis de código Python
        run: |
          python -m py_compile $(git ls-files '*.py')

      - name: Ejecución de pruebas automatizadas
        run: |
          if [ -d tests ]; then
            pytest -v tests/ --junitxml=junit/test-results.xml || true
          fi

      - name: Validar ausencia de atribuciones indebidas en commits
        run: |
          echo "Comprobando mensajes de commit recientes..."
          if git log -n 10 --pretty=%B | grep -i "Co-authored-by:.*[a-zA-Z0-9._%+-]*bot\|ai\|assistant"; then
            echo "::error::Se detectó atribución indebida en los mensajes de commit."
            exit 1
          fi

      - name: Validar integridad y trazabilidad de CONTRIBUCIONES.md
        run: |
          if [ -f scripts/verify_contributions.py ]; then
            python scripts/verify_contributions.py
          fi

  frontend-build:
    name: Frontend React CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Validar e instalar dependencias frontend
        run: |
          if [ -d web ]; then
            cd web
            pnpm install
            pnpm build || true
          elif [ -d frontend ]; then
            cd frontend
            pnpm install
            pnpm build || true
          fi

  docker-syntax-check:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar sintaxis de docker-compose.yml
        run: |
          if [ -f docker-compose.yml ]; then
            docker compose config -q
            echo "docker-compose.yml sintácticamente correcto."
          fi

